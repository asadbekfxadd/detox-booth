<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Vitamin B: нет связи</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 90% at 20% 40%,rgba(255,176,0,.25),transparent 72%),#17110d;color:#fff4e0;font-family:"Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
main{max-width:520px}
h1{font-size:34px;font-weight:800;margin-bottom:12px}
p{font-size:18px;line-height:1.5;opacity:.85;margin-bottom:28px}
button{font:inherit;font-weight:700;font-size:18px;padding:14px 32px;border:0;border-radius:99px;background:#ffb000;color:#1b1411;cursor:pointer}
button:hover{background:#ffc43a}
small{display:block;margin-top:22px;opacity:.55;word-break:break-all}
</style></head>
<body><main>
<h1>Нет связи с сервером</h1>
<p>Проверьте интернет на этом компьютере. Как только связь появится, нажмите «Повторить». Кассу и админку это не сломает.</p>
<button id="retry" type="button">Повторить</button>
<small id="addr"></small>
</main>
<script>
const u = new URLSearchParams(location.search).get("u") || "";
document.getElementById("addr").textContent = u;
const go = () => { if (u) location.href = u; };
document.getElementById("retry").addEventListener("click", go);
// Сами пробуем снова раз в 20 секунд, чтобы на кассе не приходилось ничего нажимать.
setInterval(() => fetch(u, { mode: "no-cors", cache: "no-store" }).then(go).catch(() => {}), 20000);
</script></body></html>
